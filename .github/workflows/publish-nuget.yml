name: Publish Nuget Packages

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write # required for NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Package
        run: dotnet pack --no-build

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: SaifAqqad

      - name: Publish packages to nuget
        run: dotnet nuget push "./dist/nupkg/*.nupkg" --skip-duplicate -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY"
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./dist/nupkg/*

      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/nupkg/*